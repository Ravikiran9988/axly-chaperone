[project]
name = "axly-chaperone"
version = "0.1.0"
description = "AXLY Chaperone — AI Agent Security & Governance Gateway (Phase 1)"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "alembic>=1.14.0,<2.0.0",
    "mcp>=1.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:uvicorn.*",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "alembic"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit security checks
    "N",   # pep8-naming
    "ASYNC", # flake8-async
    "RUF", # ruff-specific rules
]
ignore = [
    "S101", # allow assert in tests via per-file-ignores too
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
"app/tests/**/*.py" = ["S101", "S105", "S106"]
"alembic/versions/**/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
