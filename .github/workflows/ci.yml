name: AXLY Chaperone CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Lint, Migrations, Pytest & Benchmark (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: axly_chaperone_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_test_password_12345
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d axly_chaperone_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      CHAPERONE_TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci_only_test_password_12345@localhost:5432/axly_chaperone_ci
      CHAPERONE_BENCHMARK_DATABASE_URL: postgresql+asyncpg://postgres:ci_only_test_password_12345@localhost:5432/axly_chaperone_ci
      CHAPERONE_DATABASE_URL: postgresql+asyncpg://postgres:ci_only_test_password_12345@localhost:5432/axly_chaperone_ci
      CHAPERONE_ADMIN_API_KEY: axly_adm_ci_only_test_admin_key_0123456789abcdef
      CHAPERONE_API_KEY_PEPPER: ci_only_test_pepper_value

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff format and lint (including Bandit security rules)
        working-directory: backend
        run: |
          ruff format --check .
          ruff check .

      - name: Verify Alembic upgrade and downgrade against PostgreSQL
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run full Pytest suite against PostgreSQL
        working-directory: backend
        run: pytest -v

      - name: Verify 68-scenario security benchmark passes against PostgreSQL
        working-directory: backend
        run: python -m app.benchmark.runner --no-write

  frontend:
    name: Frontend Tests, Production Build & Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit & integration tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high

  security-hygiene:
    name: Secret & Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if any live .env files are tracked
        run: |
          tracked_env=$(git ls-files | grep -E '(^|/)\.env$' || true)
          if [ -n "$tracked_env" ]; then
            echo "ERROR: Tracked .env file detected: $tracked_env"
            exit 1
          fi

      - name: Scan repository history with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
